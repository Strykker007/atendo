# ============================================================
# Atendo — produção num único host (Docker Compose).
# Serve bem até ~50–80 clientes; depois: Postgres/Redis gerenciados, várias réplicas
# de api/worker atrás de um load balancer e Evolution em shards (ver docs/11).
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
# ============================================================
name: atendo-prod

x-api-image: &api-image
  build: { context: .., dockerfile: apps/api/Dockerfile }
  image: atendo/api:latest
  env_file: ../.env.production
  restart: unless-stopped
  # Mídia com STORAGE_DRIVER=local. Precisa ser volume compartilhado: são 2 réplicas, e um
  # arquivo gravado por uma teria de ser servido pela outra. Sem isto, some no deploy.
  # O container roda como uid 100 — o dono do diretório no host tem de ser 100:101.
  volumes:
    - ./volumes/storage:/app/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  api:
    <<: *api-image
    deploy: { replicas: 2 }
    expose: ["4000"]

  worker:
    <<: *api-image
    command: ["node", "dist/src/worker"]
    deploy: { replicas: 2 }
    healthcheck: { disable: true }

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    image: atendo/web:latest
    restart: unless-stopped
    expose: ["3000"]

  # Proxy reverso com HTTPS automático (Let's Encrypt). Domínios vêm do .env.production.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy-data:/data
      - ./volumes/caddy-config:/config
    depends_on: [api, web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: atendo
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB"]
    volumes: ["./volumes/postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atendo}"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: ["./volumes/redis:/data"]

  # Provider não-oficial. Para muitos números, repita este bloco como evolution-2, evolution-3 (shards).
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      evolution-db: { condition: service_healthy }
      redis: { condition: service_started }
    expose: ["8080"]
    environment:
      SERVER_URL: ${EVOLUTION_BASE_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:4000/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN
    volumes: ["./volumes/evolution:/evolution/instances"]

  # Backup diário: bancos + sessões da Evolution, com envio para storage remoto.
  # Sem isto, perder o servidor significa perder as conversas do cliente e o pareamento
  # de todos os números.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      evolution-db: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD}
      # ex.: r2:atendo-backups — "r2" é o remoto definido pelas RCLONE_CONFIG_R2_* abaixo
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_S: ${BACKUP_INTERVAL_S:-86400}
      # O rclone aceita a configuração por ambiente, o que evita montar um arquivo único:
      # quando o arquivo não existe no host, o Docker cria um DIRETÓRIO no lugar e o envio
      # falha em silêncio. Assim o segredo fica só no .env.production.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ACL: private
    volumes:
      - ./volumes/backup:/backup
      - ./volumes/evolution:/data/evolution:ro
      - ./volumes/storage:/data/storage:ro

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes: ["./volumes/evolution-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U evolution"], interval: 5s, retries: 10 }
