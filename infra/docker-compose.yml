name: atendo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atendo
      POSTGRES_PASSWORD: atendo
      POSTGRES_DB: atendo
    ports: ["5433:5432"]
    volumes: ["./volumes/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["./volumes/redis:/data"]

  # Provider QR code. A Evolution usa seu próprio Postgres/Redis.
  evolution:
    # versão FIXA (docs/04-providers-whatsapp.md#versão-da-evolution): `:latest` atualizava sozinha
    # a cada deploy — mudança de comportamento do cliente WhatsApp Web sem ninguém testar. Trocar
    # só depois de testar a nova em homologação.
    # v2.3.7 + patch do nó <biz> no Baileys (infra/evolution): sem ele os botões nativos (Pix
    # "Copiar chave Pix") são entregues mas o celular não mostra. A versão base fica no Dockerfile.
    build: ./evolution
    image: atendo/evolution-api:v2.3.7-biz
    restart: unless-stopped
    depends_on:
      evolution-db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-evolution-key}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # pool do Prisma: o padrão (núcleos×2+1 = 9) esgotava com dezenas de instâncias — QR lido sincroniza
      # centenas de contatos, a reconexão (stream 515) não achava conexão e o socket nascia zumbi
      # (docs/04-providers-whatsapp.md#socket-zumbi). O Postgres dela aceita 100.
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?connection_limit=40&pool_timeout=30
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # Webhook global: a API recebe os eventos de todas as instâncias em uma rota só
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://host.docker.internal:4000/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      # edição de mensagem (formato novo do WhatsApp chega cifrado no upsert; ver docs/04-providers-whatsapp.md)
      WEBHOOK_EVENTS_MESSAGES_EDITED: "true"
      # nomes da agenda do celular (ver docs/04-providers-whatsapp.md › De onde vem o nome do contato)
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN
      # Como o aparelho aparece em "Dispositivos conectados" e no handshake com o WhatsApp
      # (Baileys: [cliente, navegador, versão]). O padrão da Evolution é "Evolution API" — marca
      # explícita de cliente WhatsApp Web. Windows + Chrome = um WhatsApp Web comum.
      # Só vale para sessões NOVAS (QR lido depois do deploy). Ver docs/04-providers-whatsapp.md
      CONFIG_SESSION_PHONE_CLIENT: Windows
      CONFIG_SESSION_PHONE_NAME: Chrome
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./volumes/evolution:/evolution/instances"]

  evolution-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes: ["./volumes/evolution-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      retries: 10
