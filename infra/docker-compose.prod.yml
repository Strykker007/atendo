# ============================================================
# Atendo — produção num único host (Docker Compose).
# Serve bem até ~50–80 clientes; depois: Postgres/Redis gerenciados, várias réplicas
# de api/worker atrás de um load balancer e Evolution em shards (ver docs/11).
#
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build
# ============================================================
name: atendo-prod

# ---- CPU: quem atende primeiro ----
# Sem limite, qualquer serviço que disparasse (backup compactando, Evolution, consulta pesada)
# tirava processador de todos — e a tela do cliente ficava vazia esperando a API.
#  - `cpu_shares` só pesa na disputa: com CPU sobrando, todos usam o que quiserem. Na disputa,
#    api e postgres (o que o cliente vê agora) ganham de worker, evolution e backup.
#  - `cpus` é teto rígido, só onde esperar não prejudica ninguém. Valores ≤ 1 de propósito: o
#    Docker recusa `cpus` maior que o nº de núcleos da máquina.

x-api-image: &api-image
  build: { context: .., dockerfile: apps/api/Dockerfile }
  image: atendo/api:latest
  env_file: ../.env.production
  restart: unless-stopped
  # Mídia com STORAGE_DRIVER=local. Precisa ser volume compartilhado: são 2 réplicas, e um
  # arquivo gravado por uma teria de ser servido pela outra. Sem isto, some no deploy.
  # O container roda como uid 100 — o dono do diretório no host tem de ser 100:101.
  volumes:
    - ./volumes/storage:/app/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }

services:
  api:
    <<: *api-image
    deploy: { replicas: 2 }
    expose: ["4000"]
    cpu_shares: 2048

  worker:
    <<: *api-image
    command: ["node", "dist/src/worker"]
    deploy: { replicas: 2 }
    healthcheck: { disable: true }
    # filas (envio, fluxos, campanhas) aguentam segundos de atraso; a tela do atendente não
    cpu_shares: 512
    cpus: 1.0

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_BRAND_ID: ${NEXT_PUBLIC_BRAND_ID:-}
    image: atendo/web:latest
    restart: unless-stopped
    expose: ["3000"]
    cpu_shares: 1024

  # Proxy reverso com HTTPS automático (Let's Encrypt). Domínios vêm do .env.production.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy-data:/data
      - ./volumes/caddy-config:/config
    depends_on: [api, web]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: atendo
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB"]
    cpu_shares: 2048
    volumes: ["./volumes/postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atendo}"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: ["./volumes/redis:/data"]

  # Provider QR code. Para muitos números, repita este bloco como evolution-2, evolution-3 (shards).
  evolution:
    # versão FIXA (docs/04-providers-whatsapp.md#versão-da-evolution): `:latest` atualizava sozinha
    # a cada deploy — mudança de comportamento do cliente WhatsApp Web sem ninguém testar. Trocar
    # só depois de testar a nova em homologação.
    # v2.3.7 + patch do nó <biz> no Baileys (infra/evolution): sem ele os botões nativos (Pix
    # "Copiar chave Pix") são entregues mas o celular não mostra. A versão base fica no Dockerfile.
    build: ./evolution
    # Fora do deploy comum (docs/27-deploy-evolution.md): o profile faz `docker compose up -d` sem
    # nome de serviço IGNORAR a Evolution — recriar o container reconecta todos os números. Trocar a
    # imagem só por scripts/deploy-evolution.sh. EVOLUTION_IMAGE só existe para o rollback.
    profiles: ["evolution"]
    image: ${EVOLUTION_IMAGE:-atendo/evolution-api:v2.3.7-atendo.5}
    restart: unless-stopped
    # só prioridade, sem teto: ela recebe as mensagens de todos os números, e um teto atrasaria
    # mensagem chegando
    cpu_shares: 512
    depends_on:
      evolution-db: { condition: service_healthy }
      redis: { condition: service_started }
    expose: ["8080"]
    environment:
      SERVER_URL: ${EVOLUTION_BASE_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # pool do Prisma: o padrão (núcleos×2+1 = 9) esgotava com dezenas de instâncias — QR lido sincroniza
      # centenas de contatos, a reconexão (stream 515) não achava conexão e o socket nascia zumbi
      # (docs/04-providers-whatsapp.md#socket-zumbi). O Postgres dela aceita 100.
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?connection_limit=40&pool_timeout=30
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      # cache "número tem WhatsApp?" da Evolution (tabela IsOnWhatsapp): o .env da imagem liga, e a
      # consulta faz LIKE '%…%' na tabela inteira a cada mensagem/contato — com 180 mil linhas derrubou
      # 25 números em 19/10/2026 (docs/23-evolution-desempenho.md › 9). Sem cache, pergunta ao WhatsApp.
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:4000/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      # edição de mensagem (formato novo do WhatsApp chega cifrado no upsert; ver docs/04-providers-whatsapp.md)
      WEBHOOK_EVENTS_MESSAGES_EDITED: "true"
      # nomes da agenda do celular (ver docs/04-providers-whatsapp.md › De onde vem o nome do contato)
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN
      # Como o aparelho aparece em "Dispositivos conectados" e no handshake com o WhatsApp
      # (Baileys: [cliente, navegador, versão]). O padrão da Evolution é "Evolution API" — marca
      # explícita de cliente WhatsApp Web. Windows + Chrome = um WhatsApp Web comum.
      # Só vale para sessões NOVAS (QR lido depois do deploy). Ver docs/04-providers-whatsapp.md
      CONFIG_SESSION_PHONE_CLIENT: Windows
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes: ["./volumes/evolution:/evolution/instances"]

  # Evolution canário (docs/27-deploy-evolution.md#canário): imagem nova em poucos números antes de ir
  # para todos. Banco (`evolution_canary`) e Redis (db 7) próprios: ela nunca carrega as instâncias da
  # principal — duas Evolution com a mesma credencial abririam dois sockets e se derrubariam (440).
  # A API só manda para cá as instâncias de EVOLUTION_CANARY_INSTANCES. Fora do deploy comum, como a
  # principal: sobe só com `--profile evolution-canary`.
  evolution-canary:
    build: ./evolution
    profiles: ["evolution-canary"]
    image: ${EVOLUTION_CANARY_IMAGE:-atendo/evolution-api:v2.3.7-atendo.6}
    restart: unless-stopped
    cpu_shares: 512
    depends_on:
      evolution-db: { condition: service_healthy }
      redis: { condition: service_started }
    expose: ["8080"]
    environment:
      SERVER_URL: http://evolution-canary:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution_canary?connection_limit=10&pool_timeout=30
      DATABASE_CONNECTION_CLIENT_NAME: evolution_canary
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/7
      CACHE_REDIS_PREFIX_KEY: evolution-canary
      CACHE_LOCAL_ENABLED: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://api:4000/webhooks/evolution
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_EDITED: "true"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN
      CONFIG_SESSION_PHONE_CLIENT: Windows
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes: ["./volumes/evolution-canary:/evolution/instances"]

  # Backup diário: bancos + sessões da Evolution, com envio para storage remoto.
  # Sem isto, perder o servidor significa perder as conversas do cliente e o pareamento
  # de todos os números.
  backup:
    build: ./backup
    restart: unless-stopped
    # roda todo dia em BACKUP_AT (padrão 03:30, horário de Brasília) — de dia o pg_dump do banco da
    # Evolution pesava nos bancos. Compactar banco + mídia é o que mais pode esperar: teto baixo
    cpu_shares: 128
    cpus: 0.5
    depends_on:
      postgres: { condition: service_healthy }
      evolution-db: { condition: service_healthy }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD}
      # ex.: r2:atendo-backups — "r2" é o remoto definido pelas RCLONE_CONFIG_R2_* abaixo
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-${BACKUP_KEEP_DAYS:-14}}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      # O rclone aceita a configuração por ambiente, o que evita montar um arquivo único:
      # quando o arquivo não existe no host, o Docker cria um DIRETÓRIO no lugar e o envio
      # falha em silêncio. Assim o segredo fica só no .env.production.
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      # R2 assina requisições S3 na região lógica "auto". Para tokens restritos a
      # um bucket, a verificação administrativa (HeadBucket) não é autorizada;
      # o rclone deve ir direto às operações de objetos.
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ACL: private
    volumes:
      - ./volumes/backup:/backup
      - ./volumes/evolution:/data/evolution:ro
      - ./volumes/storage:/data/storage:ro

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    # teto: num pico (consulta sem índice, backup) o banco da Evolution não toma a máquina inteira e
    # a API/painel seguem respondendo; na disputa perde para a API (1024) e o postgres principal (2048)
    cpus: 2
    cpu_shares: 512
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    # tabela Message com milhões de linhas: com o padrão (128MB) quase nada fica em memória
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=8GB"]
    volumes: ["./volumes/evolution-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U evolution"], interval: 5s, retries: 10 }
